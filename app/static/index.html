<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculateur de prix — Artisans malgaches</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>Calculateur de prix pour artisans</h1>
    <p class="subtitle">Matériaux + temps + marge = prix juste 🇲🇬</p>
  </header>

  <main>
    <!-- Formulaire -->
    <section class="card">
      <h2>Nouveau calcul</h2>
      <form id="form-calcul">
        <label>
          Nom du produit
          <input type="text" id="nom_produit" required placeholder="Ex : Panier en raphia" />
        </label>

        <label>
          Coût des matériaux (Ar)
          <input type="number" id="cout_materiaux" min="0" step="100" required placeholder="5000" />
        </label>

        <label>
          Temps de travail (heures)
          <input type="number" id="temps_heures" min="0" step="0.5" required placeholder="3" />
        </label>

        <label>
          Taux horaire (Ar/h)
          <input type="number" id="taux_horaire" min="0" step="100" required placeholder="2000" />
        </label>

        <label>
          Marge souhaitée (%)
          <input type="number" id="marge" min="0" step="1" required placeholder="30" />
        </label>

        <button type="submit">Calculer et enregistrer</button>
      </form>

      <div id="resultat" class="resultat hidden"></div>
    </section>

    <!-- Historique -->
    <section class="card">
      <h2>Historique des calculs</h2>
      <button id="btn-refresh" type="button">Rafraîchir</button>
      <div id="historique">Chargement…</div>
    </section>
  </main>

  <footer>
    <p>Petit outil local — FastAPI + SQLite + JS vanilla</p>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
